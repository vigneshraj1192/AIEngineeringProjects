[project]
name = "codepilot-agent"
version = "0.1.0"
description = "Autonomous terminal-based multi-agent coding platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.0",
    "textual>=8.0.0",
    "chromadb>=1.5.0",
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-community>=0.4.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.0",
    "pygithub>=2.10.0",
    "pydantic>=2.10.0",
    "rich>=15.0.0",
    "python-dotenv>=1.2.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
